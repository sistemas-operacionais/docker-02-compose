services:
  consumidor:
    build: .
    command: python consumidor.py
    volumes:
      - ./src/python:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - produtor
  produtor:
    build: .
    command: python -u produtor.py
    ports:
      - "5000:5000"
    volumes:
      - ./src/python:/app